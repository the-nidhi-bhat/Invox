AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: INVOX API — M9 Lambda + API Gateway + DynamoDB

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        LOG_LEVEL: INFO
        INVOICE_TABLE_NAME: !Ref InvoiceTable
        BEDROCK_REGION: ap-south-1
        BEDROCK_MODEL_ID: in.anthropic.claude-haiku-4-5-20251001-v1:0
    Tracing: Active

Resources:
  # DynamoDB Table for Invoice Persistence
  InvoiceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: invox-invoices
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: invoice_id
          AttributeType: S
      KeySchema:
        - AttributeName: invoice_id
          KeyType: HASH
      # Note: For production, add GSI on invoice_number and idempotency_key
      # GlobalSecondaryIndexes:
      #   - IndexName: invoice_number-index
      #     KeySchema:
      #       - AttributeName: invoice_number
      #         KeyType: HASH
      #     Projection:
      #       ProjectionType: ALL
      #   - IndexName: idempotency_key-index
      #     KeySchema:
      #       - AttributeName: idempotency_key
      #         KeyType: HASH
      #     Projection:
      #       ProjectionType: ALL

  # API Gateway
  InvoxApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,OPTIONS'"
        MaxAge: "'86400'"
      Auth:
        DefaultAuthorizer: NONE
        Authorizers: {}
      EndpointConfiguration: REGIONAL
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

  # Lambda Function — single function for all endpoints
  InvoxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: invox-api
      Handler: src.app.lambda_handler
      CodeUri: src/
      Policies:
        # Least privilege: Bedrock invoke for extraction, basic Lambda execution
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:ap-south-1:${AWS::AccountId}:inference-profile/in.anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:ap-south-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:ap-south-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
              Condition:
                StringLike:
                  bedrock:InferenceProfileArn: !Sub arn:aws:bedrock:ap-south-1:${AWS::AccountId}:inference-profile/in.anthropic.claude-haiku-4-5-20251001-v1:0
        # DynamoDB permissions for invoice persistence
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
                - dynamodb:DescribeTable
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt InvoiceTable.Arn
      Events:
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref InvoxApi
            Path: /health
            Method: GET
        ExtractPost:
          Type: Api
          Properties:
            RestApiId: !Ref InvoxApi
            Path: /extract
            Method: POST
        InvoiceGeneratePost:
          Type: Api
          Properties:
            RestApiId: !Ref InvoxApi
            Path: /invoice/generate
            Method: POST
        InvoiceGet:
          Type: Api
          Properties:
            RestApiId: !Ref InvoxApi
            Path: /invoice/{invoice_id}
            Method: GET
        UpiGeneratePost:
          Type: Api
          Properties:
            RestApiId: !Ref InvoxApi
            Path: /upi/generate
            Method: POST
        # Catch-all for other routes (returns 404)
        CatchAll:
          Type: Api
          Properties:
            RestApiId: !Ref InvoxApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${InvoxApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt InvoxFunction.Arn
  InvoiceTableName:
    Description: DynamoDB table name for invoices
    Value: !Ref InvoiceTable
  InvoiceTableArn:
    Description: DynamoDB table ARN for invoices
    Value: !GetAtt InvoiceTable.Arn